server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pasta de materiais: lista os arquivos automaticamente (autoindex),
    # assim basta colocar um arquivo dentro da pasta que ele já aparece.
    location /materiais/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }

    # Pagina privada de acesso rapido (logins dos sistemas) - protegida por senha
    location /acesso-rapido/ {
        auth_basic "Acesso restrito";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
